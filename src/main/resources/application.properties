spring.application.name=multi-format-large-file-processor
server.port=8081

# JPA Configuration
# Use EMBEDDED for development/testing with embedded DBs. Use NEVER in production if schema is managed externally (e.g., Flyway, Liquibase) or after first setup.
spring.sql.init.mode=EMBEDDED
spring.jpa.hibernate.ddl-auto=update
# Consider 'validate' or 'none' if using spring.sql.init.mode=NEVER or external schema management.
spring.jpa.show-sql=false
# Recommend false for cleaner batch logs
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Make sure this matches your actual database if not using an embedded one for tests.
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- Spring Batch Configuration ---
spring.batch.job.enabled=false
# Prevent jobs from running automatically on startup
# Use 'embedded' for dev/test with embedded DBs, 'never' in prod after first run or if managed externally.
spring.batch.jdbc.initialize-schema=always
# Optional: Table prefix for batch metadata tables
# spring.batch.jdbc.table-prefix=BATCH_
batch.job.customer.chunk-size=100
batch.job.customer.csv.columns=index,customerId,firstName,lastName,company,city,country,phone1,phone2,email,subscriptionDateStr,website
# Max items to skip before failing step
batch.job.customer.skip-limit=100
# --- File Upload Configuration ---
# Ensure this directory exists and the application has write permissions
app.upload.dir=/tmp/customer_uploads/
# Or another suitable path

# Optional: Configure max file size
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

spring.threads.virtual.enabled=true